name: Simple CI Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run CI on Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Hello World
        run: |
          echo "GitHub Actions is working!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
